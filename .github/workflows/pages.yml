name: FreePhoto | Build & publish website
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: freephoto-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v -p 'test_*.py'
      - name: Build locked upstream + FreePhoto website
        run: python build.py --out dist
      - name: Verify generated website, attribution, and assets
        run: |
          test -f dist/index.html
          test -f dist/freephoto-site.css
          test -f dist/freephoto-mark.svg
          test -f dist/.nojekyll
          test -f dist/LICENSE
          test -f dist/docs/ATTRIBUTIONS.md
          test -f dist/FORK-NOTICE.md
          grep -q 'id="fp-heading"' dist/index.html
          grep -q 'id="tool"' dist/index.html
          grep -q 'id="privacy"' dist/index.html
          grep -q 'assets/js/compression.js' dist/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy FreePhoto
        id: deployment
        uses: actions/deploy-pages@v4
