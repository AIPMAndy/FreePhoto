name: FreePhoto quality gate
on:
  pull_request:
    paths:
      - '**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v -p 'test_*.py'
      - name: Build pinned GPL upstream
        run: python build.py --out dist
      - name: Verify license and local assets
        run: |
          test -f dist/LICENSE
          test -f dist/docs/ATTRIBUTIONS.md
          test -f dist/FORK-NOTICE.md
          test -f dist/assets/vendor/browser-image-compression.js
          grep -q 'FreePhoto' dist/index.html
          ! grep -q 'location.origin}/assets/vendor' dist/assets/js/compression.js
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.56.0' 'Pillow==12.0.0' 'pillow-heif==1.8.1'
          python -m playwright install --with-deps chromium
      - name: Chromium smoke (desktop + mobile viewport)
        run: python tests/smoke_browser.py
      - name: Chromium formats, privacy, and partial ZIP regression
        run: python tests/realworld_browser.py
      - name: Chromium synthetic HEIC and 30-image batch object URL lifecycle
        run: python tests/batch_browser.py
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freephoto-test-evidence
          path: artifacts/
          if-no-files-found: ignore
